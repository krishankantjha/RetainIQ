name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Enable pip caching for faster subsequent runs

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Verify ML dependency versions
        run: |
          python -c "import sklearn; v=sklearn.__version__.split('.'); assert (int(v[0]), int(v[1])) == (1, 5), f'Expected scikit-learn 1.5.x, got {sklearn.__version__}'"

      - name: Validate Python Syntax
        run: |
          python -m compileall backend ml tests

      - name: Run Test Suite
        run: |
          python -m pytest

