version: '3.8'

# Local stack: SQLite file DB + single admin login (no Postgres, no public sign-up by default).
# From docker/: docker compose --env-file ../.env up --build

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: retainiq-backend
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=sqlite:///./data/customer_retention.db
    volumes:
      - ../backend/logs:/app/backend/logs
      - retainiq_sqlite:/app/backend/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: always

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: retainiq-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always

  nginx:
    image: nginx:alpine
    container_name: retainiq-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: always

volumes:
  retainiq_sqlite:
