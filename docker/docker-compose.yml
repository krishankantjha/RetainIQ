version: '3.8'

# Local stack: SQLite file DB + single admin login (no Postgres, no public sign-up by default).
# Set JWT_SECRET and ADMIN_PASSWORD_HASH in .env for any shared/public deployment.

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: retainiq-backend
    environment:
      - DATABASE_URL=sqlite:///./data/customer_retention.db
      - APP_ENV=${APP_ENV:-development}
      - ALLOW_USER_REGISTRATION=false
      - JWT_SECRET=${JWT_SECRET:-}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost}
    volumes:
      - ../backend/logs:/app/backend/logs
      - retainiq_sqlite:/app/backend/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: always

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: retainiq-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always

  nginx:
    image: nginx:alpine
    container_name: retainiq-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: always

volumes:
  retainiq_sqlite:
